<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rayane Web Studio — Connexion Gmail</title>
<meta name="description" content="Connectez-vous avec votre compte Google (Gmail) pour accéder à Rayane Web Studio." />
<meta property="og:title" content="Rayane Web Studio — Connexion Gmail" />
<meta property="og:description" content="Connectez-vous avec votre compte Google (Gmail) pour accéder à Rayane Web Studio." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#e2dfdf; --grey:#b4b4b4; --line:#b4b4b4; --pill:#c9c8c8; --card:#cac2c2; --ink:#000;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:"DM Sans",system-ui,sans-serif;
    display:grid;place-items:center;padding:24px;
  }
  [hidden]{display:none!important}
  .login-shell{
    width:min(460px,100%);
    background:#ebe9e9;
    border:1.5px solid var(--line);
    border-radius:18px;
    padding:36px 32px 30px;
    box-shadow:0 18px 40px rgba(0,0,0,.08);
  }
  .brand-row{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .brand-mark{
    width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.03em;flex:none;
  }
  .brand-name{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .brand-sub{font-size:12px;color:rgba(0,0,0,.62)}
  .hero-title{
    margin:0 0 10px;font-family:"Playfair Display",Georgia,serif;font-weight:600;
    font-size:clamp(26px,4vw,32px);line-height:1.15;text-wrap:balance;
  }
  .hero-desc{margin:0 0 24px;font-size:14px;line-height:1.55;color:rgba(0,0,0,.74)}
  .divider{height:1px;background:rgba(0,0,0,.12);margin:20px 0}

  .google-btn{
    width:100%;height:48px;border:1.5px solid rgba(0,0,0,.18);border-radius:999px;
    background:#fff;color:var(--ink);font:inherit;font-size:14.5px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;gap:12px;
    cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background-color .15s ease;
  }
  .google-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,0,0,.09);background:#fafafa}
  .google-btn:focus-visible,.action-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .google-btn:disabled{opacity:.65;cursor:wait}

  .account-card{
    display:flex;align-items:center;gap:12px;padding:12px 14px;
    border-radius:12px;background:var(--card);margin-bottom:16px;
  }
  .account-av{
    width:44px;height:44px;border-radius:50%;background:var(--grey);overflow:hidden;flex:none;
    display:grid;place-items:center;font-weight:700;font-size:16px;
  }
  .account-av img{width:100%;height:100%;object-fit:cover;display:block}
  .account-meta{min-width:0;flex:1}
  .account-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .account-email{font-size:12.5px;color:rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .actions-stack{display:flex;flex-direction:column;gap:10px}
  .action-btn{
    width:100%;height:44px;border-radius:999px;border:1.5px solid rgba(0,0,0,.16);
    background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    text-decoration:none;cursor:pointer;transition:background-color .15s ease,transform .2s var(--ease);
  }
  .action-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .action-btn.primary:hover{background:#222}
  .action-btn.danger:hover{background:#fee2e2;border-color:#fca5a5;color:#991b1b}

  .status-banner{
    margin-top:16px;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.45;
  }
  .status-banner.error{background:#fee2e2;color:#7f1d1d;border:1px solid #fca5a5}
  .status-banner.info{background:var(--pill);color:var(--ink)}
  .foot-note{margin:18px 0 0;font-size:12px;color:rgba(0,0,0,.58);text-align:center}
</style>
</head>
<body>
  <main class="login-shell" aria-label="Connexion Rayane Web Studio">
    <div class="brand-row">
      <div class="brand-mark" aria-hidden="true">RWS</div>
      <div>
        <div class="brand-name">Rayane Web Studio</div>
        <div class="brand-sub">Accès membre</div>
      </div>
    </div>

    <h1 class="hero-title" id="login-title">Connectez-vous avec votre compte Gmail</h1>
    <p class="hero-desc" id="login-desc">
      L’authentification Google est requise pour accéder à l’accueil, aux publications, aux annonces et à votre messagerie.
    </p>

    <div id="signed-in-panel" hidden>
      <div class="account-card">
        <div class="account-av" id="acct-av"></div>
        <div class="account-meta">
          <div class="account-name" id="acct-name">Utilisateur</div>
          <div class="account-email" id="acct-email"></div>
        </div>
      </div>
      <div class="actions-stack">
        <a class="action-btn primary" href="index.html" id="continue-home-btn">Continuer vers l’accueil</a>
        <button type="button" class="action-btn" id="switch-google-btn">Changer de compte Gmail</button>
        <button type="button" class="action-btn danger" id="signout-btn">Se déconnecter</button>
      </div>
    </div>

    <div id="signed-out-panel">
      <button type="button" class="google-btn" id="google-signin-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.3-1.5 3.8-5.4 3.8-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.3 14.6 2.4 12 2.4A9.6 9.6 0 0 0 2.4 12 9.6 9.6 0 0 0 12 21.6c5.5 0 9.2-3.9 9.2-9.4 0-.6-.1-1.1-.2-1.6H12z"/>
          <path fill="#34A853" d="M3.4 7.3l3.2 2.3A6 6 0 0 1 12 6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.3 14.6 2.4 12 2.4c-3.7 0-6.9 2.1-8.6 4.9z"/>
          <path fill="#FBBC05" d="M12 21.6c2.5 0 4.6-.8 6.2-2.2l-2.9-2.4c-.8.6-1.9 1-3.3 1-3.8 0-5.1-2.5-5.4-3.7l-3.2 2.5c1.7 3 4.8 4.8 8.6 4.8z"/>
          <path fill="#4285F4" d="M21.2 12.2c0-.6-.1-1.2-.2-1.8H12v3.9h5.4c-.3 1.3-1 2.3-2 3l2.9 2.4c1.7-1.6 2.9-4 2.9-7.5z"/>
        </svg>
        <span id="google-btn-label">Continuer avec Google (Gmail)</span>
      </button>
    </div>

    <div class="status-banner info" id="auth-status" role="status" hidden></div>
    <p class="foot-note">Redirection automatique vers l’accueil après connexion.</p>
  </main>

  <script type="module" src="/src/login-entry.ts"></script>
</body>
</html>
